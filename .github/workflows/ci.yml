# Build and test md-wingman on an Apple Silicon Mac for every pull request
# and every push to main. Nothing here signs in to Claude or Jev: the Rust
# tests and the service tests run without network credentials.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  app:
    name: App (macOS, Rust)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled; it reads rust-toolchain.toml and installs
      # the pinned toolchain (with rustfmt and clippy) on first use.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release app
        run: cargo build --release -p md-wingman --locked

      # The same packaging users get from scripts/install.sh, signed ad-hoc
      # and installed to a scratch folder, so the install guide keeps working.
      - uses: oven-sh/setup-bun@v2

      - name: Package and install md-wingman.app
        env:
          WINGMAN_CODESIGN_IDENTITY: "-"
          WINGMAN_INSTALL_DIR: ${{ runner.temp }}/Applications
        run: |
          scripts/install.sh
          codesign --verify --strict --deep "$WINGMAN_INSTALL_DIR/md-wingman.app"
          plutil -lint "$WINGMAN_INSTALL_DIR/md-wingman.app/Contents/Info.plist"
          test -x "$WINGMAN_INSTALL_DIR/md-wingman.app/Contents/Resources/wingman-service"

  service:
    name: Assistant service (macOS, Bun)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build service binary
        run: bun run build
