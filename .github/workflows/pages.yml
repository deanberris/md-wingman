# Publish the project website in site/ to GitHub Pages
# (https://md-wingman.dev/) on every push to main that
# changes it. Needs Settings ▸ Pages ▸ Source set to "GitHub Actions", and the
# custom domain md-wingman.dev set there too (Actions deploys ignore a CNAME file).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
